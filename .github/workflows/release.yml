name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.1.0'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Create or find draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          if release_id="$(gh release view "$TAG_NAME" --json databaseId --jq '.databaseId' 2>/dev/null)"; then
            echo "Using existing release $release_id for $TAG_NAME"
          else
            release_id="$(
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="$TAG_NAME" \
                -f target_commitish="$GITHUB_SHA" \
                -f name="App $TAG_NAME" \
                -f body="See the assets to download this version and install." \
                -F draft=true \
                -F prerelease=false \
                --jq '.id'
            )"
            echo "Created draft release $release_id for $TAG_NAME"
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Sync node version
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ inputs.version || github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.platform == 'ubuntu-22.04' && '--bundles appimage,deb,rpm' || '' }}
